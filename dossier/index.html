<html lang="fr">
<head>

<title>Votre dossier · APOLLO</title>

<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<style>
/* Le dossier du futur consultant : lien personnel, maquette validee le 24/11/2026. */
:root { --bg: #F7F4EF; --ink: #0B0B0D; --txt: #26262C; --soft: #4A4A52; --muted: #6B6B76; --line: #ECE5DA; --line2: #E2DBD1; --orange: #F77F00; --cream: #FEF2E6; --green: #1E6B3A; --green-bg: #F1F8F3; --green-line: #CFE8D7; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select { font: inherit; }
button { cursor: pointer; }
a { color: var(--ink); }
.page { max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; }
header.tete { background: var(--ink); color: #F4F4F6; padding: 22px 22px 26px; border-radius: 0 0 26px 26px; }
@media (min-width: 600px) { header.tete { border-radius: 0 0 28px 28px; padding: 28px 28px 30px; } }
.l1 { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.l1 img { height: 36px; width: auto; display: block; }
.l1 span { font-size: 12px; color: #A3A3AD; }
.prog { margin-top: 22px; display: flex; gap: 6px; }
.prog div { flex: 1; height: 5px; border-radius: 3px; background: #34343E; }
.prog .on { background: var(--orange); }
.prog .mi { background: rgba(247, 127, 0, 0.5); }
.progl { margin-top: 8px; display: flex; justify-content: space-between; font-size: 11.5px; color: #A3A3AD; }
.progl .cur { color: var(--orange); font-weight: 600; }
h1 { margin: 22px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
.lead { margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: #C9C9D1; }
.test { margin-top: 16px; display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--orange); border: 1px solid rgba(247, 127, 0, 0.5); border-radius: 6px; padding: 3px 8px; }
main { padding: 18px 16px 36px; display: flex; flex-direction: column; gap: 14px; }
.sec { background: #FFFFFF; border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.sec .h { display: flex; align-items: center; gap: 10px; }
.num { flex: none; width: 26px; height: 26px; border-radius: 13px; background: var(--ink); color: var(--orange); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sec h2 { margin: 0; font-size: 17px; font-weight: 700; }
.sec .intro { margin: 10px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--soft); }
.opts { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line2); border-radius: 14px; padding: 13px 15px; cursor: pointer; }
.opt.on { border: 2px solid var(--ink); padding: 12px 14px; }
.opt input { flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--orange); }
.opt b { display: block; font-size: 15px; font-weight: 600; line-height: 1.5; }
.opt small { display: block; font-size: 13px; line-height: 1.5; color: var(--muted); }
.opts.ligne { flex-direction: row; flex-wrap: wrap; }
.opts.ligne .opt { flex: 1 1 200px; }
.champ { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #3A3A42; }
.champ input, .champ select { width: 100%; border: 1px solid var(--line2); background: #FFFFFF; border-radius: 10px; padding: 11px 12px; font-size: 16px; font-weight: 400; color: var(--ink); outline: none; }
.champ input:focus, .champ select:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(247, 127, 0, 0.16); }
.champ input.siren { font-weight: 500; letter-spacing: 0.04em; }
.champ .aide { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.duo { display: flex; gap: 10px; flex-wrap: wrap; }
.duo .champ { flex: 1 1 180px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; border: 1px solid var(--line2); background: #FFFFFF; border-radius: 12px; padding: 11px 12px; font-size: 15px; font-weight: 600; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #F4F4F6; }
.sirene { margin-top: 10px; border-radius: 12px; padding: 12px 14px; }
.sirene.ok { background: var(--green-bg); border: 1px solid var(--green-line); }
.sirene.ko { background: var(--cream); border: 1px solid #F3D3AE; }
.sirene.wait { background: #F5F1EA; border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.sirene .t { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
.sirene.ok .t { color: var(--green); }
.sirene.ko .t { color: #8A4A00; }
.sirene .n { margin-top: 4px; font-size: 15px; font-weight: 600; }
.sirene .d { font-size: 13px; color: var(--soft); }
.bascule { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; cursor: pointer; }
.bascule b { display: block; font-size: 15px; font-weight: 600; }
.bascule small { display: block; font-size: 13px; color: var(--muted); }
.bascule input { flex: none; width: 22px; height: 22px; accent-color: var(--orange); }
.encart { margin-top: 14px; background: var(--cream); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; color: var(--txt); }
.pieces { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.piece { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.piece.attente { border: 1.5px dashed #F7B266; background: var(--cream); }
.piece .i { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--green-bg); display: flex; align-items: center; justify-content: center; }
.piece.attente .i { background: #FFFFFF; }
.piece .c { flex: 1; min-width: 0; }
.piece .c b { display: block; font-size: 14px; font-weight: 600; line-height: 1.4; }
.piece .c small { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.piece.attente .c small { color: var(--soft); white-space: normal; }
.piece .aj { flex: none; border: 0; background: var(--ink); color: #F4F4F6; border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 600; }
.piece .rem { flex: none; border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; text-decoration: underline; padding: 6px; }
.piece .aj[disabled], .piece .rem[disabled] { opacity: 0.6; cursor: default; }
.pied { display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 0; }
.pied .rassure { font-size: 14px; font-weight: 600; text-align: center; }
.certif { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.5; color: var(--txt); cursor: pointer; }
.certif input { flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--orange); }
.go { width: 100%; border: 0; background: var(--orange); color: var(--ink); border-radius: 14px; padding: 17px; font-size: 16px; font-weight: 700; }
.go[disabled] { background: #F3C089; cursor: default; }
.manque { margin: -2px 0 0; font-size: 12.5px; line-height: 1.5; color: #8A4A00; text-align: center; }
.fin { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); text-align: center; }
.erreur { background: #FBE4E4; color: #7A1E1E; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
.etat { font-size: 12px; color: #A3A3AD; margin-top: 10px; min-height: 18px; }
.carte-fin { background: #FFFFFF; border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; text-align: left; }
.carte-fin .ok { width: 44px; height: 44px; border-radius: 22px; background: var(--green-bg); display: flex; align-items: center; justify-content: center; }
.carte-fin h2 { margin: 14px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.carte-fin p { margin: 8px 0 0; font-size: 14.5px; line-height: 1.55; color: var(--soft); }
.centre { padding: 60px 0; display: grid; place-items: center; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #E2DBD1; border-top-color: var(--orange); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 200%); visibility: hidden; transition: transform 0.25s ease, visibility 0.25s; z-index: 30; max-width: calc(100vw - 32px); background: var(--ink); color: #F4F4F6; border-radius: 14px; padding: 12px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
.toast.err { background: #7A1E1E; }
</style>
</head>
<body>
<div class="page">
  <header class="tete">
    <div class="l1"><img src="/assets/apollo-full.png" alt="APOLLO" width="102" height="36"><span id="etapeTxt">Étape 2 sur 3</span></div>
    <div class="prog" id="prog"><div class="on"></div><div class="mi"></div><div></div></div>
    <div class="progl" id="progl"><span>Accord signé</span><span class="cur">Votre dossier</span><span>Votre contrat</span></div>

  <main id="corps"><div class="centre"><div class="spinner" aria-label="Chargement"></div></div></main>
</div>
<input type="file" id="fichier" accept=".pdf,.jpg,.jpeg,.png,.heic,.heif,.webp,application/pdf,image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/supabase.js"></script>
<script>

  function esc(v) { return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

  function chiffres(s) { return String(s || "").replace(/\D/g, ""); }

  function tva(siren) { var c = chiffres(siren); if (c.length !== 9) return ""; var k = (12 + 3 * Number(BigInt(c) % 97n)) % 97; return "FR" + String(k).padStart(2, "0") + c; }
  function tvaLisible(n) { return n ? n.replace(/^FR(\d{2})(\d{3})(\d{3})(\d{3})$/, "FR $1 $2 $3 $4") : ""; }

  async function api(action, data) {
    var r, j = null;
    try {
      r = await fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ route: "dossier", action: action, jeton: JETON }, data || {})) });
      j = await r.json();
    } catch (x) { throw new Error("Le réseau ne répond pas pour l'instant. Réessayez dans un instant."); }
    if (!r.ok || !j || j.ok === false) { var e = new Error((j && j.erreur) || "Une erreur est survenue."); e.status = r.status; throw e; }
    return j;
  }

  /* ---------- en-tete ---------- */
  function entete() {

    $("test").hidden = !E.test;
    if (envoye) {
      $("etapeTxt").textContent = "Étape 3 sur 3";
      $("prog").innerHTML = '<div class="on"></div><div class="on"></div><div class="mi"></div>';

        $("titre").textContent = p + ", vos justificatifs.";

        $("etapeTxt").textContent = "Contrat signé";
        $("prog").innerHTML = '<div class="on"></div><div class="on"></div><div class="on"></div>';
        $("progl").innerHTML = '<span>Accord signé</span><span>Dossier</span><span class="cur">Contrat signé</span>';
      }
    } else {
      $("titre").textContent = p + ", faisons les présentations officielles.";
      $("lead").textContent = "Ces informations servent à rédiger votre contrat. Dix minutes suffisent.";
    }
  }

  /* ---------- pieces ---------- */
  function presents() {
    var m = {};
    (E.pieces || []).forEach(function (x) { if (!m[x.type] || new Date(x.depose_at) > new Date(m[x.type].depose_at)) m[x.type] = x; });
    return m;
  }
  function attendues(pr) {
    if (D.statut === "non_immatricule" && !pr.kbis) return ["recepisse", "rc_pro", "rib"];
    return ["kbis", "rc_pro", "urssaf", "rib"];
  }
  function libelle(type) {
    var L = {
      kbis: D.statut === "ei" ? ["Avis de situation Sirene ou extrait RNE", "Sur avis-situation-sirene.insee.fr"] : D.statut === "non_immatricule" ? ["Extrait Kbis ou avis de situation Sirene", "Dès votre immatriculation"] : ["Extrait Kbis de moins de 3 mois", "Sur infogreffe.fr ou monidenum.fr"],
      rc_pro: ["Attestation d'assurance RC Pro", "Responsabilité civile professionnelle en cours"],
      urssaf: ["Attestation de vigilance URSSAF", "Moins de 6 mois, sur urssaf.fr"],
      rib: ["RIB professionnel", "Pour le règlement de vos commissions"],
      recepisse: ["Récépissé de déclaration de création", "Délivré par le guichet unique de l'INPI"]
    };
    return L[type];
  }
  var COCHE = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6B3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var DEPOT = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6M9 14l3-3 3 3"/></svg>';
  function urssafAvenir(x) { return x && new Date(new Date(x.depose_at).getTime() + 167 * 86400000) < new Date(); }
  function htmlPieces() {
    var pr = presents();
    return attendues(pr).map(function (t) {
      var x = pr[t], l = libelle(t), arenouveler = t === "urssaf" && urssafAvenir(x);
      if (x && !arenouveler) {
        return '<div class="piece"><span class="i">' + COCHE + '</span><div class="c"><b>' + esc(l[0]) + "</b><small>" + esc(x.nom_fichier || "Document") + " · ajouté</small></div>" +
          '<button type="button" class="rem" data-depot="' + t + '">Remplacer</button></div>';
      }
      return '<div class="piece attente"><span class="i">' + DEPOT + '</span><div class="c"><b>' + esc(l[0]) + "</b><small>" + (arenouveler ? "À renouveler : la précédente a bientôt six mois" : esc(l[1])) + "</small></div>" +
        '<button type="button" class="aj" data-depot="' + t + '">Ajouter</button></div>';
    }).join("");
  }

  /* ---------- le formulaire ---------- */
  function opt(nom, val, titre, sous, coche) {
    return '<label class="opt' + (coche ? " on" : "") + '"><input type="radio" name="' + nom + '" value="' + val + '"' + (coche ? " checked" : "") + "><span><b>" + titre + "</b><small>" + sous + "</small></span></label>";
  }
  function champ(k, lib, o) {
    o = o || {};
    var v = D[k] == null ? "" : D[k];
    if (k === "siren") v = sirenLisible(v);

      h += '<div class="opts ligne" id="formes-prevues">' +

      if (D.forme_prevue === "societe") {
        h += champ("denomination", "Dénomination envisagée") +
          '<div class="duo">' + champ("forme", "Forme envisagée", { liste: "formes" }) + champ("siege", "Adresse du futur siège") + "</div>";
      }
      h += '<div class="encart">Votre contrat vous laisse <b>60 jours</b> pour transmettre votre immatriculation. D\'ici là, le récépissé de dépôt de votre déclaration suffit, et votre numéro SIREN pourra être ajouté ici dès réception.</div>';
    }
    return h + "</section>";
  }
  function secCoordonnees() {
    var h = '<section class="sec"><div class="h"><span class="num">3</span><h2>Vos coordonnées</h2></div>' +
      '<div class="champ">Civilité<div class="seg" id="civ"><button type="button" data-v="Madame" aria-pressed="' + (D.civilite === "Madame") + '">Madame</button><button type="button" data-v="Monsieur" aria-pressed="' + (D.civilite === "Monsieur") + '">Monsieur</button></div></div>' +
      champ("telephone", "Téléphone", { attrs: ' inputmode="tel" autocomplete="tel"' });
    if (D.statut !== "ei") h += champ("adresse", D.statut === "societe" ? "Votre adresse personnelle" : "Votre adresse", { attrs: ' autocomplete="street-address"', aide: D.statut === "societe" ? "pour l'autorisation d'image jointe au contrat" : "" });
    return h + "</section>";
  }
  function secPieces(n) {
    return '<section class="sec"><div class="h"><span class="num">' + n + '</span><h2>Vos justificatifs</h2></div>' +
      '<p class="intro">Rien n\'est bloquant : ajoutez-les maintenant ou plus tard, depuis ce même lien. PDF ou photo, 10 Mo au plus.</p>' +
      '<div class="pieces" id="pieces">' + htmlPieces() + "</div></section>";
  }
  function manques() {
    var m = [], s9 = /^\d{9}$/.test(chiffres(D.siren));
    if (!D.statut) return ["votre statut"];
    if (D.statut === "societe") { if (!s9) m.push("le SIREN"); if (!D.denomination) m.push("la dénomination"); if (!D.forme) m.push("la forme juridique"); if (!D.siege) m.push("l'adresse du siège"); }
    if (D.statut === "ei" && !s9) m.push("le SIREN");
    if (D.statut === "non_immatricule" && D.forme_prevue === "societe" && !D.denomination) m.push("la dénomination envisagée");
    if (!D.adresse) m.push(D.statut === "ei" ? "votre adresse professionnelle" : "votre adresse");
    if (!D.certifie) m.push("la case de certification");
    return m;
  }
  function majPied() {
    var m = manques(), b = $("valider");
    if (!b) return;
    b.disabled = m.length > 0;
    $("manque").textContent = m.length ? "Il reste : " + m.join(", ") + "." : "";
    var t = $("tvaTxt");
    if (t) {
      var n = tva(D.siren);
      t.textContent = D.tva_assujetti ? (n ? "N° TVA calculé : " + tvaLisible(n) : "N° TVA calculé dès le SIREN saisi") : (D.statut === "ei" ? "Franchise en base : TVA non applicable, art. 293 B du CGI" : "Non assujettie");
    }
  }
  function formulaire() {
    var h = secStatut();
    if (D.statut) {
      h += secEntreprise() + secCoordonnees() + secPieces(4) +
        '<div class="pied"><div class="rassure">Une pièce manque ? Votre contrat part quand même.</div>' +
        '<label class="certif"><input type="checkbox" data-k="certifie"' + (D.certifie ? " checked" : "") + ">Je certifie l'exactitude de ces informations.</label>" +
        '<div class="erreur" id="err" hidden></div>' +
        '<button type="button" class="go" id="valider">Valider et recevoir mon contrat</button>' +
        '<p class="manque" id="manque"></p>' +
        '<p class="fin">Vos documents sont conservés de façon sécurisée et servent uniquement à votre contrat. Une question ? Répondez au mail reçu : Frédéric et Gilles vous lisent.</p></div>';
    } else {
      h += '<p class="fin" style="padding:6px 8px 0">Choisissez votre statut : la suite s\'adapte.</p>';
    }
    h += '<datalist id="formes">' + FORMES.map(function (f) { return '<option value="' + f + '">'; }).join("") + "</datalist>" +
      '<datalist id="qualites"><option value="Président"><option value="Présidente"><option value="Gérant"><option value="Gérante"><option value="Directeur général"><option value="Directrice générale"></datalist>';
    $("corps").innerHTML = h;
    majPied();
    if ((D.statut === "societe" || D.statut === "ei") && /^\d{9}$/.test(chiffres(D.siren))) chercherSiren(true);
  }
  function apres() {
    var h = '<div class="carte-fin"><div class="ok">' + COCHE + "</div>";
    if (["accord_signe", "dossier_valide", "contrat_envoye"].indexOf(E.statut) >= 0) {
      h += "<h2>C'est parti.</h2><p>Votre contrat est rédigé à votre nom et vous attend dans votre boîte mail. Signez-le en ligne : APOLLO le contresigne aussitôt, et votre mail de bienvenue suit.</p>";
    } else {
      h += "<h2>Votre contrat est signé.</h2><p>Merci. Il ne reste que quelques documents à nous transmettre, à votre rythme.</p>";
    }
    h += "</div>";
    if (D.statut === "non_immatricule") {
      h += '<section class="sec"><div class="h"><span class="num">1</span><h2>Votre immatriculation</h2></div>' +
        '<p class="intro">Dès réception de votre numéro SIREN, saisissez-le ici : il complète votre contrat, sans avenant.</p>' +
        champ("siren", "Numéro SIREN", { attrs: ' inputmode="numeric" autocomplete="off" class="siren" maxlength="11"', ph: "912 345 678" }) + boiteSirene() + "</section>";
    }
    h += secPieces(D.statut === "non_immatricule" ? 2 : 1) +
      '<p class="fin">Une question ? Répondez au dernier mail reçu : Frédéric et Gilles vous lisent.</p>';
    $("corps").innerHTML = h;
    if (D.statut === "non_immatricule" && /^\d{9}$/.test(chiffres(D.siren))) chercherSiren(true);
  }
  function rendre() { entete(); if (envoye) apres(); else formulaire(); }

  /* ---------- enregistrement ---------- */
  function propre() { var o = {}; CHAMPS.forEach(function (k) { if (k in D) o[k] = D[k]; }); if (o.siren) o.siren = chiffres(o.siren); return o; }
  function planifier() {
    clearTimeout(minuteur);
    $("enreg").textContent = "Enregistrement…";
    minuteur = setTimeout(enregistrer, 700);
  }
  async function enregistrer() {
    clearTimeout(minuteur);
    try {
      var j = await api("enregistrer", { dossier: envoye ? { siren: chiffres(D.siren) } : propre() });
      E.pieces = j.pieces;
      $("enreg").textContent = "Enregistré à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { $("enreg").textContent = ""; toast(e.message, true); }
  }

  /* ---------- Sirene ---------- */
  async function chercherSiren(silencieux) {
    var s = chiffres(D.siren), box = $("sirene");
    if (!box) return;
    if (s.length !== 9) { box.hidden = true; return; }
    var n = ++recherche;
    box.hidden = false; box.className = "sirene wait"; box.textContent = "Recherche au répertoire Sirene…";
    try {
      var j = await api("siren", { siren: s });
      if (n !== recherche) return;
      var e = j.entreprise;
      if (!e) { box.className = "sirene ko"; box.innerHTML = '<div class="t">Introuvable au répertoire Sirene</div><div class="d">Vérifiez les neuf chiffres : vous pouvez continuer si vous êtes sûr(e) du numéro.</div>'; return; }
      var attention = "";
      if (!e.actif) attention = "Cette entreprise est indiquée comme fermée.";
      else if (D.statut === "societe" && e.ei) attention = "Ce SIREN est celui d'une entreprise individuelle : choisissez plutôt « Entreprise individuelle ».";
      else if (D.statut === "ei" && !e.ei) attention = "Ce SIREN est celui d'une société : choisissez plutôt « Société ».";
      box.className = "sirene " + (attention ? "ko" : "ok");
      box.innerHTML = '<div class="t">' + (attention ? "À vérifier" : COCHE.replace(/18/g, "16") + "Trouvée au répertoire Sirene") + "</div>" +
        '<div class="n">' + esc(e.denomination || "") + '</div><div class="d">' + esc([e.forme, e.ville ? "siège à " + e.ville : ""].filter(Boolean).join(" · ")) + "</div>" +
        (attention ? '<div class="d" style="margin-top:6px;color:#8A4A00">' + esc(attention) + "</div>" : "");
      if (silencieux || envoye || attention) return;
      var maj = false;
      var poser = function (k, v) { if (v && !D[k]) { D[k] = v; var i = document.querySelector('[data-k="' + k + '"]'); if (i) i.value = v; maj = true; } };
      if (D.statut === "societe") { poser("denomination", e.denomination); poser("forme", e.forme); poser("siege", e.siege); }
      if (D.statut === "ei") poser("adresse", e.siege);
      if (maj) { planifier(); majPied(); }
    } catch (x) { if (n === recherche) { box.className = "sirene wait"; box.textContent = x.message; } }
  }

  /* ---------- depot de pieces ---------- */
  var TYPES = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", heic: "image/heic", heif: "image/heif", webp: "image/webp" };
  async function deposer(fichier) {
    var type = typeEnCours, btn = document.querySelector('[data-depot="' + type + '"]');
    if (!fichier || !type) return;
    var ext = (fichier.name.match(/\.([A-Za-z0-9]+)$/) || [])[1];
    ext = ext ? ext.toLowerCase() : "";
    var mime = fichier.type || TYPES[ext] || "";
    if (!TYPES[ext] && Object.values(TYPES).indexOf(mime) < 0) { toast("Format non pris en charge : PDF, JPG, PNG ou HEIC.", true); return; }
    if (fichier.size > 10 * 1024 * 1024) { toast("Ce fichier dépasse 10 Mo.", true); return; }
    if (btn) { btn.disabled = true; btn.textContent = "Envoi…"; }
    try {
      var t = await api("televersement", { type: type, nom: fichier.name, taille: fichier.size });
      var up = await sb.storage.from("recrutement").uploadToSignedUrl(t.chemin, t.jeton, fichier, { contentType: mime || "application/octet-stream" });
      if (up.error) throw new Error("Le dépôt a échoué : " + up.error.message);
      var j = await api("piece", { type: type, chemin: t.chemin, nom: fichier.name, taille: fichier.size });
      E.pieces = j.pieces;
      $("pieces").innerHTML = htmlPieces();
      toast("Document ajouté, merci.");
    } catch (e) {
      toast(e.message, true);
      if (btn) { btn.disabled = false; btn.textContent = "Ajouter"; }
    }
  }

  /* ---------- validation ---------- */
  async function valider() {
    var b = $("valider");
    if (manques().length) { majPied(); return; }
    clearTimeout(minuteur);
    b.disabled = true; b.textContent = "Rédaction de votre contrat…";
    $("err").hidden = true;
    try {
      var j = await api("valider", { dossier: propre() });
      E = j; D = Object.assign({}, j.dossier || {});
      envoye = true; rendre();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      $("err").hidden = false; $("err").textContent = e.message;
      b.disabled = false; b.textContent = "Valider et recevoir mon contrat";
    }
  }

  /* ---------- evenements ---------- */
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.name === "statut") {
      D.statut = t.value;
      if (D.statut === "non_immatricule" && !D.forme_prevue) D.forme_prevue = "ei";
      if (D.statut === "societe" && D.tva_assujetti == null) D.tva_assujetti = true;
      formulaire(); planifier(); return;
    }
    if (t.name === "forme_prevue") { D.forme_prevue = t.value; formulaire(); planifier(); return; }
    if (t.id === "fichier") { deposer(t.files && t.files[0]); t.value = ""; return; }
    var k = t.getAttribute("data-k");
    if (k && t.type === "checkbox") {
      D[k] = t.checked;
      if (k === "tva_assujetti") D.tva_numero = t.checked ? tva(D.siren) : null;
      majPied(); if (!(envoye && k !== "siren")) planifier();
    }
  });
  document.addEventListener("input", function (e) {
    var t = e.target, k = t.getAttribute("data-k");
    if (!k || t.type === "checkbox") return;
    if (k === "siren") {
      var c = chiffres(t.value).slice(0, 9), pos = sirenLisible(c);
      if (t.value !== pos) t.value = pos;
      D.siren = c;
      if (D.tva_assujetti) D.tva_numero = tva(c);
      if (c.length === 9) chercherSiren(false); else { var box = $("sirene"); if (box) box.hidden = true; }
    } else D[k] = t.value;
    majPied();
    if (!envoye || k === "siren") planifier();
  });
  document.addEventListener("click", function (e) {
    var c = e.target.closest("#civ button");
    if (c) {
      D.civilite = c.getAttribute("data-v");
      document.querySelectorAll("#civ button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === c)); });
      planifier(); return;
    }
    var d = e.target.closest("[data-depot]");
    if (d) { typeEnCours = d.getAttribute("data-depot"); $("fichier").click(); return; }
    if (e.target.id === "valider") valider();
  });
  window.addEventListener("pagehide", function () { if (minuteur) { clearTimeout(minuteur); enregistrer(); } });

  async function demarrer() {
    if (!JETON) { erreur("Ce lien est incomplet. Ouvrez-le à nouveau depuis le mail reçu."); return; }
    try {
      E = await api("charger");
      D = Object.assign({}, E.dossier || {});
      if (!D.civilite && E.civilite) D.civilite = E.civilite;
      if (!D.telephone && E.telephone) D.telephone = E.telephone;
      envoye = !!E.contrat_envoye || E.statut !== "accord_signe";
      rendre();
    } catch (e) { erreur(e.message); }
  }
  function erreur(m) {
    $("titre").textContent = "Ce lien ne répond plus.";
    $("lead").textContent = "Pas d'inquiétude : nous vous en envoyons un nouveau sur simple demande.";
    $("corps").innerHTML = '<div class="carte-fin"><h2 style="margin-top:0">' + esc(m) + '</h2><p>Répondez au dernier mail reçu d\'APOLLO : Frédéric et Gilles vous lisent et vous renvoient un lien.</p></div>';
  }
  demarrer();
})();
</script>
</body>
</html>
